<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlotte - Holographic Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d19; /* Deep Slate Indigo */
            --accent: #14b8a6; /* Electric Aqua-Teal */
            --accent-sec: #6366f1; /* Energetic Indigo-Purple */
            --cta-grad: linear-gradient(135deg, var(--accent), var(--accent-sec));
            --card-bg: rgba(21, 23, 42, 0.4);
            --card-border: rgba(20, 184, 166, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #151932 0%, var(--bg-color) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Ambient Glow Behind Everything */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(50px);
            z-index: 0;
            animation: pulse-ambient 8s ease-in-out infinite alternate;
        }

        @keyframes pulse-ambient {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Floating Hologram Container */
        .hologram-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
            animation: float-stage 10s ease-in-out infinite;
        }

        @keyframes float-stage {
            0% { transform: translateY(0px) rotateX(2deg) rotateY(-2deg); }
            50% { transform: translateY(-20px) rotateX(-2deg) rotateY(2deg); }
            100% { transform: translateY(0px) rotateX(2deg) rotateY(-2deg); }
        }

        /* The Avatar Core */
        .avatar-core {
            width: 140px;
            height: 140px;
            margin-bottom: 3rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-inner {
            width: 80px;
            height: 80px;
            background: var(--cta-grad);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent-sec);
            animation: breathe 3s ease-in-out infinite alternate;
        }

        .ring-1, .ring-2 {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(20, 184, 166, 0.4);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .ring-1 {
            width: 140px;
            height: 140px;
            border-top: 2px solid var(--accent);
            animation: spin-right 8s linear infinite;
        }

        .ring-2 {
            width: 170px;
            height: 170px;
            border-bottom: 2px solid var(--accent-sec);
            border-left: 2px solid transparent;
            animation: spin-left 12s linear infinite;
        }

        @keyframes breathe {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }
        @keyframes spin-right { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spin-left { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }

        /* Glass Panels */
        .panels-wrapper {
            display: flex;
            gap: 2rem;
            transform: translateZ(30px);
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            width: 320px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                        inset 0 0 20px rgba(20, 184, 166, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-25deg);
            animation: glass-shine 6s infinite;
        }

        @keyframes glass-shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        h2 {
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
            background: var(--cta-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            margin: 0 0 2rem 0;
            line-height: 1.5;
        }

        /* Holographic Button */
        .btn-holo {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--accent);
            padding: 0.875rem 2rem;
            border-radius: 50px;
            font-family: var(--font-head);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(20, 184, 166, 0.2);
        }

        .btn-holo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--cta-grad);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .btn-holo:hover {
            color: white;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(20, 184, 166, 0.6);
            transform: translateY(-2px);
        }

        .btn-holo:hover::after { opacity: 1; }

        .waveform {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 40px;
            margin-bottom: 1.5rem;
        }
        
        .bar {
            width: 4px;
            background: var(--accent);
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite alternate;
        }

        .bar:nth-child(1) { height: 10px; animation-delay: 0.0s; }
        .bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
        .bar:nth-child(3) { height: 20px; animation-delay: 0.2s; }
        .bar:nth-child(4) { height: 40px; animation-delay: 0.3s; }
        .bar:nth-child(5) { height: 15px; animation-delay: 0.4s; }

        @keyframes wave { 0% { height: 5px; opacity: 0.5; } 100% { height: 35px; opacity: 1; box-shadow: 0 0 10px var(--accent); } }

    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="hologram-stage">
        
        <div class="avatar-core">
            <div class="core-inner"></div>
            <div class="ring-1"></div>
            <div class="ring-2"></div>
        </div>

        <div class="panels-wrapper">
            <div class="glass-panel">
                <div class="waveform">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
                <h2>Live Interaction</h2>
                <p>Charlotte is currently handling an active call with <strong>+1 (555) 019-2834</strong>.</p>
                <button class="btn-holo">Monitor Call</button>
            </div>
            
            <div class="glass-panel" style="transform: translateZ(-20px) scale(0.95); opacity: 0.8;">
                <h2 style="margin-top: 1rem;">Daily Summary</h2>
                <p>All routines functioning nominally. Successfully captured 42 leads and booked 14 appointments.</p>
                <button class="btn-holo">View Analytics</button>
            </div>
        </div>
    </div>

</body>
</html>
