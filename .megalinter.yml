---
# MegaLinter v7 Configuration
# https://megalinter.io/latest/configuration/
#
# Strategy: explicit allowlist (ENABLE_LINTERS) scoped to our TypeScript/Node
# stack. Avoids whack-a-mole with MegaLinter's 100+ default linters — only
# the linters listed below will run.

APPLY_FIXES: none
PRINT_ALPACA: false

# Exclude generated files, dev artifacts, and scratch utilities from all linters
FILTER_REGEX_EXCLUDE: "(node_modules/|scratch/|coverage/|dist/|playwright-report/|test-results/|\\.git/|package-lock\\.json|frontend-scaffold/|\\.gemini/)"

# ─── Explicit linter allowlist ────────────────────────────────────────────────
# Only these linters run. Everything else (kics, trivy, grype, devskim,
# terrascan, djlint, htmlhint, v8r, ts-standard, jscpd, etc.) is skipped.
ENABLE_LINTERS:
  - YAML_YAMLLINT                   # Validate GitHub Actions workflow + config YAML
  - MARKDOWN_MARKDOWNLINT           # Markdown formatting (non-blocking)
  - MARKDOWN_MARKDOWN_LINK_CHECK    # Dead link detection in docs
  - JSON_JSONLINT                   # JSON syntax validation
  - SPELL_CSPELL                    # Spell checking with project dictionary
  - REPOSITORY_CHECKOV              # Terraform IaC security checks

# ─── Markdown ────────────────────────────────────────────────────────────────
# markdownlint has style warnings in spec files — treat as advisory only
MARKDOWN_MARKDOWNLINT_DISABLE_ERRORS: true
MARKDOWN_MARKDOWN_LINK_CHECK_CONFIG_FILE: .markdown-link-check.json

# ─── JSON ────────────────────────────────────────────────────────────────────
# tsconfig files use JSONC (JS comments allowed) — jsonlint rejects them
JSON_JSONLINT_FILTER_REGEX_EXCLUDE: "(tsconfig)"

# ─── Spell check ─────────────────────────────────────────────────────────────
# Dictionary and exclusions are in .cspell.json (ignorePaths covers the rest)
SPELL_CSPELL_FILE_NAME: .cspell.json

# ─── Checkov (Terraform IaC) ─────────────────────────────────────────────────
# Skip checks representing intentional decisions for our GCP dev environment:
#   CKV2_GCP_12  Cloud Run allUsers — required for a public API + UI
#   CKV_GCP_6    Cloud SQL SSL — handled at application layer
#   CKV_GCP_14   Cloud SQL automated backups — not required in dev
#   CKV_GCP_26   Cloud SQL require SSL — same as CKV_GCP_6
#   CKV_GCP_79   Cloud SQL SSL connections — same family
#   CKV_GCP_88   Cloud SQL latest major version — POSTGRES_15 is intentional
#   CKV_GCP_105  Cloud Run INGRESS_TRAFFIC_ALL — intentional for public service
#   CKV_GCP_109  PostgreSQL log_min_messages — dev environment default is fine
#   CKV_GCP_62   Cloud Storage access logs — no GCS buckets in use
#   CKV_GCP_76   Cloud SQL no public IP — already private (ipv4_enabled=false)
#   CKV2_GCP_18  VPC subnet flow logs — not required for dev environment
#   CKV2_GCP_19  Cloud Run binary auth — not required for dev
#   CKV_GCP_50   Secret Manager public — using IAM-bound service accounts
REPOSITORY_CHECKOV_ARGUMENTS: "--soft-fail --skip-check CKV2_GCP_12,CKV_GCP_6,CKV_GCP_14,CKV_GCP_26,CKV_GCP_79,CKV_GCP_88,CKV_GCP_105,CKV_GCP_109,CKV_GCP_62,CKV_GCP_76,CKV2_GCP_18,CKV2_GCP_19,CKV_GCP_50"
