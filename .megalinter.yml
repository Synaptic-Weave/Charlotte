---
# MegaLinter v7 Configuration
# https://megalinter.io/latest/configuration/
#
# Strategy: scope linters to our TypeScript/Node stack, exclude generated
# artifacts and scratch utilities, and configure thresholds to reflect
# intentional patterns (test setup code, IaC for dev environment, etc.).

APPLY_FIXES: none
PRINT_ALPACA: false

# Exclude generated files, dev artifacts, and scratch utilities from all linters
FILTER_REGEX_EXCLUDE: "(node_modules/|scratch/|coverage/|dist/|playwright-report/|test-results/|\\.git/|package-lock\\.json|frontend-scaffold/)"

# ─── Disabled linters ────────────────────────────────────────────────────────
DISABLE_LINTERS:
  # devskim: Flags placeholder values in .env.example template strings (e.g.
  # "your_twilio_auth_token_here") as hardcoded secrets. These are intentional
  # template strings, not real credentials.
  - REPOSITORY_DEVSKIM

  # trivy + grype: CVE scanning for dependencies. Dependency vulnerability
  # management is handled via Dependabot and separate security workflow;
  # embedding CVE scans in the PR lint gate creates unmergeable PRs when
  # upstream packages have unpatched CVEs.
  - REPOSITORY_TRIVY
  - REPOSITORY_GRYPE

  # lychee: Redundant with markdown-link-check (both check URLs in markdown).
  # markdown-link-check is more configurable; running both doubles false positives.
  - SPELL_LYCHEE

  # flake8: Python is not part of our application stack. The only .py file in
  # the repo is scratch/append_blog.py — a one-off utility script, not tested code.
  - PYTHON_FLAKE8

# ─── Copy-paste detection (jscpd) ───────────────────────────────────────────
# Raise thresholds to avoid flagging test fixture setup blocks and entity
# schemas that share structural patterns by design.
COPYPASTE_JSCPD_ARGUMENTS: "--min-lines 30 --min-tokens 120 --ignore-pattern 'tests/**'"

# ─── Spell check (cspell) ────────────────────────────────────────────────────
SPELL_CSPELL_FILE_NAME: .cspell.json
SPELL_CSPELL_FILTER_REGEX_EXCLUDE: "(package-lock\\.json|coverage/|dist/|node_modules/|scratch/|playwright-report/|test-results/)"

# ─── Markdown link check ─────────────────────────────────────────────────────
MARKDOWN_MARKDOWN_LINK_CHECK_CONFIG_FILE: .markdown-link-check.json
MARKDOWN_MARKDOWN_LINK_CHECK_FILTER_REGEX_EXCLUDE: "(frontend-scaffold/|package-lock\\.json)"

# ─── Checkov (Terraform IaC) ─────────────────────────────────────────────────
# Skip checks that represent intentional decisions for our GCP dev environment:
#   CKV2_GCP_12: Cloud Run allUsers access — required for a public-facing API/UI
#   CKV_GCP_6:   Cloud SQL SSL enforcement — handled at application layer
#   CKV_GCP_14:  Cloud SQL automated backups — not required for dev environment
#   CKV_GCP_26:  Cloud SQL SSL connections — same as CKV_GCP_6
#   CKV_GCP_88:  Cloud SQL latest major version — using POSTGRES_15, intentional
#   CKV_GCP_79:  Cloud SQL SSL — redundant with above
#   CKV_GCP_105: Cloud Run ingress — INGRESS_TRAFFIC_ALL is intentional
REPOSITORY_CHECKOV_ARGUMENTS: "--skip-check CKV2_GCP_12,CKV_GCP_6,CKV_GCP_14,CKV_GCP_26,CKV_GCP_79,CKV_GCP_88,CKV_GCP_105,CKV_GCP_62,CKV_GCP_76,CKV2_GCP_18,CKV2_GCP_19,CKV_GCP_50"

# ─── Stylelint (CSS) ─────────────────────────────────────────────────────────
# Scope to our frontend source only; exclude scaffold templates and spec docs.
# The @import url() in index.css has been converted to string notation to
# comply with stylelint's import-notation rule default.
CSS_STYLELINT_FILTER_REGEX_INCLUDE: "(frontend/src/)"
