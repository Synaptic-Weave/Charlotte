---
name: Continuous Deployment

"on":
  push:
    branches:
      - main
  workflow_dispatch:

# yamllint disable rule:line-length
env:
  PROJECT_ID: charlotte-sw
  REGION: us-central1
  BACKEND_IMAGE: >-
    us-central1-docker.pkg.dev/charlotte-sw/charlotte-repo/charlotte-backend
  FRONTEND_IMAGE: >-
    us-central1-docker.pkg.dev/charlotte-sw/charlotte-repo/charlotte-frontend
# yamllint enable rule:line-length

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: >-
            projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: >-
            github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Backend Image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest .
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and Push Frontend Image
        working-directory: ./frontend
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest .
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  deploy-uat:
    name: Deploy to UAT
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: UAT
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: >-
            projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: >-
            github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Database Migrations
        run: |
          gcloud run jobs update charlotte-db-migrate \
            --region ${{ env.REGION }} \
            --image ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          gcloud run jobs execute charlotte-db-migrate \
            --region ${{ env.REGION }} \
            --wait

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy charlotte-backend-uat \
            --image ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account="charlotte-backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --vpc-connector="projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/connectors/charlotte-vpc-conn" \
            --vpc-egress="private-ranges-only" \
            --update-env-vars="NODE_ENV=production,JWT_EXPIRY=24h,BCRYPT_SALT_ROUNDS=12,GEMINI_MODEL_NAME=gemini-3.1-flash-live-preview,GEMINI_VOICE_ID=aoede,CHARLOTTE_API_BASE_URL=https://charlotte-backend-uat-701784399937.us-central1.run.app" \
            --set-secrets="DATABASE_URL=database_url:latest,TWILIO_ACCOUNT_SID=twilio_account_sid:latest,TWILIO_AUTH_TOKEN=twilio_auth_token:latest,TWILIO_API_KEY=twilio_api_key:latest,TWILIO_API_SECRET=twilio_api_secret:latest,GEMINI_API_KEY=gemini_api_key:latest,JWT_SECRET=jwt_secret:latest" \
            --quiet

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy charlotte-frontend-uat \
            --image ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account="charlotte-frontend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --update-env-vars="VITE_API_URL=https://charlotte-backend-uat-701784399937.us-central1.run.app" \
            --quiet

  deploy-prod:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: >-
            projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: >-
            github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Database Migrations
        run: |
          gcloud run jobs update charlotte-db-migrate \
            --region ${{ env.REGION }} \
            --image ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          gcloud run jobs execute charlotte-db-migrate \
            --region ${{ env.REGION }} \
            --wait

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy charlotte-backend-prod \
            --image ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account="charlotte-backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --vpc-connector="projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/connectors/charlotte-vpc-conn" \
            --vpc-egress="private-ranges-only" \
            --update-env-vars="NODE_ENV=production,JWT_EXPIRY=24h,BCRYPT_SALT_ROUNDS=12,GEMINI_MODEL_NAME=gemini-3.1-flash-live-preview,GEMINI_VOICE_ID=aoede,CHARLOTTE_API_BASE_URL=https://charlotte-backend-prod-unsa2gq4ta-uc.a.run.app" \
            --set-secrets="DATABASE_URL=database_url:latest,TWILIO_ACCOUNT_SID=twilio_account_sid:latest,TWILIO_AUTH_TOKEN=twilio_auth_token:latest,TWILIO_API_KEY=twilio_api_key:latest,TWILIO_API_SECRET=twilio_api_secret:latest,GEMINI_API_KEY=gemini_api_key:latest,JWT_SECRET=jwt_secret:latest" \
            --quiet

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy charlotte-frontend-prod \
            --image ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account="charlotte-frontend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --update-env-vars="VITE_API_URL=https://charlotte-backend-prod-701784399937.us-central1.run.app" \
            --quiet
