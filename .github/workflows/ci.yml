---
name: CI Guardrails

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. Run MegaLinter to enforce code quality
  lint:
    name: Lint Code Base (MegaLinter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MegaLinter needs full history for diff validation

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v7
        env:
          # Configuration for MegaLinter
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Limit linters to keep CI fast and focused on our core tech stack
          TYPESCRIPT_ESLINT_FILTER: true
          CSS_STYLELINT_FILTER: true
          HTML_HTMLHINT_FILTER: true
          MARKDOWN_MARKDOWNLINT_FILTER: true
          # Disable reporting of success comments on PRs to keep the timeline clean
          PR_REPORTER_STATUS: true

  # 2. Run Tests and enforce 80% coverage
  test:
    name: Build & Test (Enforce 80% Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Run Build
        run: npm run build --if-present

      - name: Run Tests with Coverage
        run: npm run test:coverage
